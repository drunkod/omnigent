name: T11 secrecy hardening

on:
  push:
    branches:
      - feat/mvp-remaining-tracks
    paths:
      - .github/workflows/t11-secrecy-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp-remaining-tracks
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Remove legacy secret-bearing extras and test
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          schema_path = Path("omnigent/server/schemas.py")
          schema = schema_path.read_text(encoding="utf-8")
          needle = '''                "command_preview",
                "diff_preview",
'''
          replacement = '''                "command_preview",
                "command_summary",
                "diff_preview",
'''
          count = schema.count(needle)
          if count != 2:
              raise SystemExit(f"expected two local-action cleanup tuples, found {count}")
          schema_path.write_text(schema.replace(needle, replacement), encoding="utf-8")

          test_path = Path("tests/test_t11_local_action_schema.py")
          test = test_path.read_text(encoding="utf-8")
          old = '''    assert params.local_action.command_preview == "curl [arguments hidden]"
    assert "secret" not in str(params.local_action.model_dump())
'''
          new = '''    assert params.local_action.command_preview == "curl [arguments hidden]"
    dumped = params.model_dump()
    assert "command_summary" not in dumped
    assert "secret" not in str(dumped)
'''
          if old not in test:
              raise SystemExit("schema secrecy assertion marker missing")
          test_path.write_text(test.replace(old, new, 1), encoding="utf-8")
          PY

          uv sync --extra dev --frozen
          uv run python -m pytest -q \
            tests/test_t11_local_action_schema.py \
            tests/runner/test_local_action_approval_side_effects.py
          git diff --check

          rm .github/workflows/t11-secrecy-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(t11): drop legacy command summaries from approval params"
          git push origin HEAD:feat/mvp-remaining-tracks
