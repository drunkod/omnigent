name: T11 one-shot implementation

on:
  push:
    branches:
      - feat/mvp-remaining-tracks
    paths:
      - .github/workflows/t11-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp-remaining-tracks
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply, test, and commit T11
        shell: bash
        run: |
          set +e
          LOG=/tmp/t11-implementation.log
          (
            set -euxo pipefail
            python .github/scripts/implement_t11.py
            python .github/scripts/implement_t11_post.py

            python -m pip install --upgrade pip
            python -m pip install \
              pytest \
              pytest-asyncio \
              pydantic \
              fastapi \
              httpx \
              pyyaml \
              sqlalchemy \
              zstandard \
              cachetools \
              packaging
            PYTHONPATH=".:sdks/python-client:sdks/ui-sdk" \
              python -m compileall -q omnigent/runner/local_actions.py omnigent/server/schemas.py
            PYTHONPATH=".:sdks/python-client:sdks/ui-sdk" \
              python -m pytest -q \
                tests/test_t11_local_action_schema.py \
                tests/runner/test_local_action_approval_side_effects.py

            npm --prefix web ci
            cd web
            npx prettier --write \
              src/lib/localActionApproval.ts \
              src/lib/localActionApproval.test.ts \
              src/lib/events.ts \
              src/lib/blocks.ts \
              src/lib/renderItems.ts \
              src/lib/sse.ts \
              src/components/blocks/ApprovalCard.tsx \
              src/components/blocks/ApprovalCard.test.tsx \
              src/components/blocks/LocalActionApprovalCard.tsx \
              src/components/blocks/LocalActionApprovalCard.test.tsx
            npm run type-check
            npx vitest run \
              src/lib/localActionApproval.test.ts \
              src/components/blocks/LocalActionApprovalCard.test.tsx \
              src/components/blocks/ApprovalCard.test.tsx
            cd ..

            git diff --check
          ) >"$LOG" 2>&1
          STATUS=$?
          cat "$LOG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$STATUS" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            cp "$LOG" .github/t11-implementation-failure.txt
            git add .github/t11-implementation-failure.txt
            git commit -m "chore(t11): record implementation failure"
            git push origin HEAD:feat/mvp-remaining-tracks
            exit "$STATUS"
          fi

          rm -f \
            .github/workflows/t11-implementation.yml \
            .github/scripts/implement_t11.py \
            .github/scripts/implement_t11_post.py \
            .github/t11-implementation-failure.txt
          git add -A
          git commit -m "feat(t11): implement local-action approval UI"
          git push origin HEAD:feat/mvp-remaining-tracks
