        """Retire both server and runner state for the active tunnel generation."""
        session = self.registry.get(self.runner_id)
        assert session is not None
        self.registry.deregister(self.runner_id, session=session)
        await _cancel_ws_channels(self.ws_channels)
        self.ws_channels.clear()
'''
            new = '''    async def disconnect(self) -> RunnerSession:
        """Retire the active generation and return it for stale-frame tests."""
        session = self.registry.get(self.runner_id)
        assert session is not None
        removed = self.registry.deregister(self.runner_id, session=session)
        assert removed is session
        await _cancel_ws_channels(self.ws_channels)
        self.ws_channels.clear()
        return session
'''
            if old not in text:
                raise SystemExit("TunnelHarness.disconnect marker missing")
            helper.write_text(text.replace(old, new, 1), encoding="utf-8")

            conftest = Path("tests/terminal_e2e/conftest.py")
            text = conftest.read_text(encoding="utf-8")
            text = text.replace(
                "from omnigent.runner.transports.ws_tunnel.registry import TunnelRegistry\n",
                "from omnigent.runner.transports.ws_tunnel.registry import RunnerSession, TunnelRegistry\n",
                1,
            )
            old = '''    async def disconnect_runner(self) -> None:
        """Drop the active runner generation while leaving tmux alive."""
        await self.tunnel.disconnect()
'''
            new = '''    async def disconnect_runner(self) -> RunnerSession:
        """Drop the active runner generation while leaving tmux alive."""
        return await self.tunnel.disconnect()
'''
            if old not in text:
                raise SystemExit("TerminalTunnelFixture.disconnect_runner marker missing")
            conftest.write_text(text.replace(old, new, 1), encoding="utf-8")

            lifecycle = Path("tests/terminal_e2e/test_lifecycle.py")
            text = lifecycle.read_text(encoding="utf-8")
            text = text.replace(
                "from websockets.exceptions import ConnectionClosed\n\nfrom tests.terminal_e2e.conftest import TerminalTunnelFixture\n",
                "from websockets.exceptions import ConnectionClosed\n\nfrom omnigent.runner.transports.ws_tunnel.frames import WSCloseFrame\nfrom tests.terminal_e2e.conftest import TerminalTunnelFixture\n",
                1,
            )
            addition = '''

async def test_stale_generation_close_cannot_cover_live_reconnected_terminal(
    terminal_tunnel: TerminalTunnelFixture,
    monkeypatch,
) -> None:
    """A late close from the retired generation cannot tear down the new attach."""

    class _FixedSecrets:
        @staticmethod
        def token_hex(_length: int) -> str:
            return "deadbeef"

    monkeypatch.setattr("omnigent.server._runner_ws_tunnel.secrets", _FixedSecrets())
    headers = {"X-Forwarded-Email": "owner@example.com"}

    async with connect(terminal_tunnel.url(), additional_headers=headers) as first:
        await _receive_until(first, b"T12_READY")
