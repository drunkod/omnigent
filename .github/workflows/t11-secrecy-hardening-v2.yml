name: T11 secrecy hardening v2

on:
  push:
    branches:
      - feat/mvp-remaining-tracks
    paths:
      - .github/workflows/t11-secrecy-hardening-v2.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp-remaining-tracks
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch and verify
        shell: bash
        run: |
          set +e
          LOG=/tmp/t11-hardening.log
          (
            set -euxo pipefail
            python - <<'PY'
            import ast
            from pathlib import Path

            schema_path = Path("omnigent/server/schemas.py")
            schema = schema_path.read_text(encoding="utf-8")
            needle = '                "command_preview",\n                "diff_preview",'
            replacement = (
                '                "command_preview",\n'
                '                "command_summary",\n'
                '                "diff_preview",'
            )
            count = schema.count(needle)
            if count != 2:
                raise SystemExit(f"expected two local-action cleanup sites, found {count}")
            schema = schema.replace(needle, replacement)
            ast.parse(schema)
            schema_path.write_text(schema, encoding="utf-8")

            test_path = Path("tests/test_t11_local_action_schema.py")
            test = test_path.read_text(encoding="utf-8")
            old = '''    assert params.local_action.command_preview == "curl [arguments hidden]"
    assert "secret" not in str(params.local_action.model_dump())
'''
            new = '''    assert params.local_action.command_preview == "curl [arguments hidden]"
    dumped = params.model_dump()
    assert "command_summary" not in dumped
    assert "secret" not in str(dumped)
'''
            if old not in test:
                raise SystemExit("schema secrecy assertion marker missing")
            test = test.replace(old, new, 1)
            ast.parse(test)
            test_path.write_text(test, encoding="utf-8")
            PY
            python -m compileall -q omnigent/server/schemas.py tests/test_t11_local_action_schema.py
            git diff --check
          ) >"$LOG" 2>&1
          STATUS=$?
          cat "$LOG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$STATUS" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            cp "$LOG" .github/t11-hardening-failure.txt
            git add .github/t11-hardening-failure.txt
            git commit -m "chore(t11): record secrecy hardening failure"
            git push origin HEAD:feat/mvp-remaining-tracks
            exit "$STATUS"
          fi

          rm -f \
            .github/workflows/t11-secrecy-hardening.yml \
            .github/workflows/t11-secrecy-hardening-v2.yml \
            .github/t11-hardening-failure.txt
          git add -A
          git commit -m "fix(t11): drop legacy command summaries from approval params"
          git push origin HEAD:feat/mvp-remaining-tracks
