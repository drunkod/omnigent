name: Terminal E2E

on:
  pull_request:
    paths:
      - "omnigent/inner/terminal.py"
      - "omnigent/runner/**"
      - "omnigent/server/_runner_ws_tunnel.py"
      - "omnigent/server/routes/terminal_attach.py"
      - "omnigent/terminals/**"
      - "tests/terminal_e2e/**"
      - ".github/workflows/terminal-e2e.yml"

permissions:
  contents: read

jobs:
  terminal-e2e-control:
    name: terminal-e2e-control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: uv sync --extra dev --frozen
      - name: Report terminal prerequisites
        run: |
          uv run python -c "from omnigent.version import VERSION; print('server/runner version:', VERSION)"
          tmux -V
          echo "terminal transport: control"
      - run: uv run python -m pytest -q tests/terminal_e2e/test_control_attach.py
