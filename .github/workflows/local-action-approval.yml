name: Local action approval

on:
  pull_request:
    paths:
      - "omnigent/runner/local_actions.py"
      - "omnigent/runner/pending_approvals.py"
      - "omnigent/server/schemas.py"
      - "omnigent/server/routes/**"
      - "tests/test_t11_local_action_schema.py"
      - "tests/runner/test_local_action_approval_side_effects.py"
      - "web/src/components/blocks/ApprovalCard.tsx"
      - "web/src/components/blocks/LocalActionApprovalCard.tsx"
      - "web/src/components/blocks/*.test.tsx"
      - "web/src/lib/blocks.ts"
      - "web/src/lib/events.ts"
      - "web/src/lib/localActionApproval.ts"
      - "web/src/lib/localActionApproval.test.ts"
      - "web/src/lib/renderItems.ts"
      - "web/src/lib/sse.ts"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/local-action-approval.yml"

permissions:
  contents: read

jobs:
  local-action-approval-contract:
    name: local-action-approval-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run python -m pytest -q tests/test_t11_local_action_schema.py

  local-action-approval-side-effects:
    name: local-action-approval-side-effects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: Report strict-shell prerequisite
        run: |
          if command -v bwrap >/dev/null 2>&1; then
            echo "bubblewrap available: strict-shell fixtures may run"
          else
            echo "bubblewrap unavailable: trusted-machine denial fixture remains authoritative"
          fi
      - run: uv run python -m pytest -q tests/runner/test_local_action_approval_side_effects.py
      - run: >-
          uv run python -m pytest -q
          tests/runner/transports/ws_tunnel/test_tunnel_e2e.py
          tests/server/test_local_action_approval_gate.py
          tests/server/test_local_action_persistence.py
          tests/server/integration/test_sessions_elicitation_resolve_url.py
          -k 'local_action or nested_local_action'

  web-local-action-approval:
    name: web-local-action-approval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: >-
          npx vitest run
          src/lib/localActionApproval.test.ts
          src/components/blocks/LocalActionApprovalCard.test.tsx
          src/components/blocks/ApprovalCard.test.tsx
          src/store/chatStore.test.ts
